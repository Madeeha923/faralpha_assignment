apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: flask-assignment
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: "<replace-with-username>"
  MONGO_INITDB_ROOT_PASSWORD: "<replace-with-strong-password>"
  MONGODB_URI: "mongodb://<replace-with-username>:<url-encoded-password>@mongodb:27017/?authSource=admin"
