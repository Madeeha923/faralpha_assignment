
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: flask-assignment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask-app
          image: faralpha-flask-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGODB_URI
            - name: MONGODB_DATABASE
              value: flask_assignment
          resources:
            requests:
              cpu: 200m
              memory: 250M
            limits:
              cpu: 500m
              memory: 500M
